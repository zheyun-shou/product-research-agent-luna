# Hidden targets for `scout eval-hidden` (agent-loop design, section 10). Each target is one real product of
# amazon.se. An LLM wrote the opening and the facts on 2026-10-06 from the stored page of the product, without its
# name, brand or model. The facts are true of the product; a few other products can also meet them. hidden_words
# are the brand and the model: Python stops the run when the shopper writes one.
# Prices are those of the first week of October 2026; a budget leaves a margin of 10 to 25 percent.
# Only the fridge category has a full profile now. Other categories need a profile first.
# search: the fixed search of `scout eval-search` (2026-10-16): Swedish words as Luna writes them, the needs from
# the facts, and the word filters that the facts ask for (my choice, as Luna would choose them).

- id: red-bottom-freezer
  source_id: B08PL233S8
  category: fridge
  kind: fridge_freezer
  opening: 我想要一台红色的冰箱，带冷冻室，厨房那个位置宽50厘米、高145厘米
  facts:
    - The space is 50 cm wide, 145 cm high and 60 cm deep.
    - You want a red fridge with a glossy front.
    - The freezer part is at the bottom.
    - About 170 to 180 litres in all is enough.
    - The budget is 6000 SEK.
  hidden_words: [Bomann, KG 320, KG 320.2, "732025"]
  search:
    words: röd kyl frys kombiskåp
    budget: 6000
    conditions:
      - {attribute: width, op: "<=", value: 50}
      - {attribute: height, op: "<=", value: 145}
      - {attribute: depth, op: "<=", value: 60}
    filters: ["Colour: Red"]

