# Held-out targets (2026-10-18). I did not use them to tune the search. I wrote the 9 needs before any search. Then I
# searched amazon.se with other words than the eval words and took, for each need, the product with the most reviews
# on page 1 that meets the need and is in stock. Two needs changed after the search: page 1 had no plain lavender
# cones (so lavender sticks), and the waterproof women's trail shoe had no size 39 (so size 38).
# also: the other listings of the same product page that meet the needs (other colours; for shoes, the size of the
# needs). The targets in targets.yaml have no also, so a find here is a little easier.
- id: anc-earbuds
