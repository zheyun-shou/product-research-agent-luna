    - Wireless earbuds with active noise cancelling, for the bus.
    - A transparency mode to hear announcements is nice.
    - Long playtime with the case, 30 hours or more.
    - The budget is 400 SEK.
  hidden_words: [Soundcore, Anker, P30i, A3959]
  search:
    words: trådlösa hörlurar brusreducering in-ear
    budget: 400
    filters: ["Headphones Form Factor: In Ear", "Noise Control: Active Noise Cancellation"]

