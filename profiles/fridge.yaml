category: fridge
display_name: Fridge
search_terms_sv: kylskåp
kinds:
  - name: fridge_freezer
    label: Fridge with a freezer part
    search_terms_sv: kyl och frys
  - name: fridge
    label: Fridge without a freezer part
    search_terms_sv: kylskåp utan frys
  - name: mini_fridge
    label: Mini fridge for a room or an office
    search_terms_sv: minikylskåp
  - name: wine_cooler
    label: Wine cooler
    search_terms_sv: vinkyl
  - name: cool_box
    label: Cool box for a car or camping
    search_terms_sv: kylbox
attributes:
  - name: height
    label: Height
    type: number
    unit: cm
    kind: hard
    title_words: [height, high, tall, höjd, hög, höhe, hoch, hauteur]
  - name: width
    label: Width
    type: number
    unit: cm
    kind: hard
    title_words: [width, wide, bredd, bred, breite, breit, largeur]
  - name: depth
    label: Depth
    type: number
    unit: cm
    kind: hard
    title_words: [depth, deep, djup, tiefe, tief, profondeur]
  - name: total_volume
    label: Total volume
    type: number
    unit: l
    kind: soft
    site_filter: Capacity
  - name: freezer_volume
    label: Freezer volume
    type: number
    unit: l
    kind: soft
  - name: noise
    label: Noise
    type: number
    unit: dB
    kind: soft
  - name: energy_class
    label: Energy class
    type: enum
    values: [A, B, C, D, E, F, G]
    kind: soft
  - name: no_frost
    label: No Frost
    type: boolean
    kind: soft
questions_for_user:
  - What kind of fridge do you want? With a freezer part, without one, a mini fridge, a wine cooler or a cool box?
  - How wide, tall and deep is the space for the fridge?
  - What is your budget?
  - Do you need a freezer part, and how big?
  - Do you care about noise?
complaint_types: [noise, frost, door seal, compressor life, after-sales service]
sources:
  products: [amazon_se]
  reviews: [amazon_se_reviews]
