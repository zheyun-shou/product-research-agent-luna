# Which model each role uses. Check names and free-tier limits when the key is created:
# https://ai.google.dev/gemini-api/docs/models
# https://ai.google.dev/gemini-api/docs/rate-limits
# https://console.groq.com/docs/rate-limits (Groq models are text only, so only chat falls back to Groq)
providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
  openrouter:  # paid account, prices per model at https://openrouter.ai/models
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
roles:
  chat:  # GPT-5.6 Luna was chosen on 2026-10-05 after eval-chat, GPT-6 Luna on 2026-10-06 (half the price). On
        # 2026-10-13 I chose Claude Haiku 5.5 during eval-hidden with the new prompt: it asked for the missing budget
        # before it searched, and Luna asked a question in 1 of 24 runs. In the first 2 targets Haiku cost about
        # 3 times as much as Luna for each run.
    provider: openrouter
    model: anthropic/claude-haiku-5.5
    rpm: 60
    fallback:
      provider: gemini
      model: gemini-3.8-flash
      rpm: 10
  worker:  # chosen on 2026-10-06 from 7 cheap models with images and tools: all titles right, image right, fastest
    provider: openrouter
    model: google/gemma-4-26b-a4b-it
    rpm: 60
    fallback:
      provider: gemini
      model: gemini-3.5-flash-lite
      rpm: 15
  researcher:  # the candidate researcher, a subagent (2026-10-20). The worker model first, because it is cheap; the
               # evaluation shows if it is good enough.
    provider: openrouter
    model: google/gemma-4-26b-a4b-it
    rpm: 60
    fallback:
      provider: gemini
      model: gemini-3.5-flash-lite
      rpm: 15
  judge:  # the grader. Haiku 5.5 from 2026-10-11 (check-grader: all faults found, no correct reply failed). Since
          # the chat model is Haiku, the grader must be another maker: GPT-6 Luna Pro from 2026-10-13. check-grader:
          # all 32 planted faults found, but 6 correct replies failed (honest 2, plain 3, facts 1). So honest and
          # plain are not good enough; use answers, facts, arithmetic and said_did. 665 s, 0.06 USD.
          # 2026-10-15, after the grader sees one turn: 31 of 32 faults found (facts missed ok-recheck), 7 correct
          # replies failed (facts 2, honest 1, plain 3, answers 1). Other items than on 2026-10-13 flip, so this is
          # the noise of one run. 861 s, 0.07 USD.
    provider: openrouter
    model: openai/gpt-6-luna-pro
    rpm: 60
  shopper:  # the simulated shopper of eval-hidden: not the maker of the chat model, and cheap
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    rpm: 60
