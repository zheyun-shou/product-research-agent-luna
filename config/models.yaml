# Which model each role uses. Check names and free-tier limits when the key is created:
# https://ai.google.dev/gemini-api/docs/models
# https://ai.google.dev/gemini-api/docs/rate-limits
# https://console.groq.com/docs/rate-limits (Groq models are text only, so only chat falls back to Groq)
providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
  openrouter:  # paid account, prices per model at https://openrouter.ai/models
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
roles:
  chat:  # chosen on 2026-10-05 after eval-chat: 24 scripts, median 15 s a turn, about 0.07 USD a full run
    provider: openrouter
    model: openai/gpt-5.6-luna
    rpm: 60
    fallback:
      provider: gemini
      model: gemini-3.8-flash
      rpm: 10
  worker:
    provider: gemini
    model: gemini-3.5-flash-lite
    rpm: 15
  judge:  # the grader of eval-chat, chosen on 2026-10-05: not an OpenAI model like the chat model, and cheap
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    rpm: 60
