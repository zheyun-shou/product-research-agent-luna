[project]
name = "product-research-agent-luna"
version = "0.1.0"
description = "Luna, a shopping research agent that picks products in any category"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langfuse>=4.16,<5",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "lxml>=5.0",
  "openai>=1.40",
  "playwright>=1.45",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "trafilatura>=2.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]
# bge-m3 on the local computer. Install torch with CUDA first, from the PyTorch index.
retrieval = ["FlagEmbedding>=1.4,<2"]

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the Postgres container (docker compose up -d)"]
