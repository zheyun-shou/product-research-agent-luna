[project]
name = "product-scout"
version = "0.1.0"
description = "A conversational agent that helps pick products in any category"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "langfuse>=4.16,<5",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "lxml>=5.0",
  "openai>=1.40",
  "playwright>=1.45",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the Postgres container (docker compose up -d)"]
