name: product-scout
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: product_scout
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
  # Web search without a paid API (decided 2026-10-07). It asks Google, Bing, DuckDuckGo and others for us.
  searxng:
    image: searxng/searxng:2026.9.23-783a09462
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
  # The web app (phase 7). Only with: docker compose --profile app up -d --build. Start Chrome first with
  # scripts/start-browser.ps1: the app uses that window for amazon.se over the DevTools port.
  app:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scout:scout@db:5432/product_scout
      SEARXNG_URL: http://searxng:8080
      BROWSER_CDP_URL: http://host.docker.internal:9222
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./data:/app/data
      - ./snapshots:/app/snapshots
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [db, searxng]
    restart: unless-stopped
    deploy:  # bge-m3 and the reranker in fp16 on the NVIDIA GPU
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  # Access from my phone through a Cloudflare tunnel to luna.example.com. Cloudflare Access lets in only my email.
  # Only with: docker compose --profile app --profile tunnel up -d. It gets only TUNNEL_TOKEN from .env, no other key.
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [app]
    restart: unless-stopped
volumes:
  pgdata: {}
